<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessando Pesquisa Acadêmica - Tribunal do Júri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #1e3a8a 0%, #1d4ed8 50%, #0f172a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      color: #1e293b;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .badge {
      background: #dbeafe;
      color: #1e3a8a;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    p.subtitle {
      font-size: 0.92rem;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e2e8f0;
      border-top: 5px solid #1e3a8a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 10px auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">UFP • 2ª Vara do Tribunal do Júri</span>
    <div class="spinner"></div>
    <h1>Preparando o seu questionário...</h1>
    <p class="subtitle">Sincronizando com o painel da pesquisa e redirecionando...</p>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyf1NY74A_2VN-Bem26a4g9axBzqObaxOlj8Pr1io9lxKIEyj-yubWy4YlrTrHGFngX/exec";

    const LINKS = {
      G1: "https://pt.surveymonkey.com/r/B8C5MS3",
      G2: "https://pt.surveymonkey.com/r/JDB6SX2",
      G3: "https://pt.surveymonkey.com/r/HCSLV3R"
    };

    let jaDisparou = false;
    let redirecionou = false;

    // 1. Detecta se quem abriu o link é um robô de pré-visualização (WhatsApp, Telegram, Facebook, etc.)
    function ehRoboDePreVisualizacao() {
      const ua = (navigator.userAgent || "").toLowerCase();
      const padraoBots = /bot|crawler|spider|crawling|whatsapp|telegram|facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|discordbot|pinterest|preview|headless/i;
      if (padraoBots.test(ua)) return true;
      if (navigator.webdriver) return true;
      if (window.outerWidth === 0 && window.outerHeight === 0) return true;
      return false;
    }

    // 2. Gera um UID único por dispositivo; se o MESMO dispositivo recarregar em menos de 15 segundos,
    // mantém o mesmo UID para evitar linha duplicada. Após 15s, permite novo teste!
    function obterUidDoDispositivo() {
      try {
        const agora = Date.now();
        const salvoUid = localStorage.getItem("UID_JURI_ATUAL");
        const salvoTs = Number(localStorage.getItem("TS_JURI_ATUAL") || "0");

        if (salvoUid && (agora - salvoTs) < 15000) {
          return salvoUid;
        }

        const novoUid = "DEV_" + agora + "_" + Math.random().toString(36).substring(2, 9);
        localStorage.setItem("UID_JURI_ATUAL", novoUid);
        localStorage.setItem("TS_JURI_ATUAL", String(agora));
        return novoUid;
      } catch (e) {
        return "DEV_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);
      }
    }

    window.receberGrupoDaPlanilha = function(data) {
      if (redirecionou) return;
      redirecionou = true;

      if (data && data.allocated_group && LINKS[data.allocated_group]) {
        window.location.replace(LINKS[data.allocated_group]);
      } else if (data && data.redirect_url) {
        window.location.replace(data.redirect_url);
      }
    };

    function iniciarAcessoHumano() {
      // Se for robô de link preview, aborta imediatamente sem chamar a planilha!
      if (ehRoboDePreVisualizacao()) return;

      // Só dispara quando a aba estiver realmente visível na tela do usuário
      if (document.visibilityState === "hidden" || document.visibilityState === "prerender") {
        document.addEventListener("visibilitychange", function quandoVisivel() {
          if (document.visibilityState === "visible") {
            document.removeEventListener("visibilitychange", quandoVisivel);
            dispararParaPlanilha();
          }
        });
        return;
      }

      // Pequeno atraso de 150ms para garantir que não é um pré-carregamento abortado do navegador
      setTimeout(dispararParaPlanilha, 150);
    }

    function dispararParaPlanilha() {
      if (jaDisparou || document.visibilityState === "hidden") return;
      jaDisparou = true;

      const uid = obterUidDoDispositivo();
      const script = document.createElement("script");
      script.src = `${APPS_SCRIPT_URL}?action=entrar&uid=${encodeURIComponent(uid)}&callback=receberGrupoDaPlanilha`;
      document.body.appendChild(script);
    }

    window.addEventListener("DOMContentLoaded", iniciarAcessoHumano);
  </script>

</body>
</html>
