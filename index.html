<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessando Pesquisa Acadêmica - Tribunal do Júri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #1e3a8a 0%, #1d4ed8 50%, #0f172a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      color: #1e293b;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .badge {
      background: #dbeafe;
      color: #1e3a8a;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    p.subtitle {
      font-size: 0.92rem;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e2e8f0;
      border-top: 5px solid #1e3a8a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 10px auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">UFP • 2ª Vara do Tribunal do Júri</span>
    <div class="spinner"></div>
    <h1>Preparando o seu questionário...</h1>
    <p class="subtitle">Sincronizando com o painel da pesquisa e redirecionando...</p>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyf1NY74A_2VN-Bem26a4g9axBzqObaxOlj8Pr1io9lxKIEyj-yubWy4YlrTrHGFngX/exec";

    const LINKS = {
      G1: "https://pt.surveymonkey.com/r/B8C5MS3",
      G2: "https://pt.surveymonkey.com/r/JDB6SX2",
      G3: "https://pt.surveymonkey.com/r/HCSLV3R"
    };

    let jaDisparou = false;
    let redirecionou = false;

    // Gera ou recupera o ID único desta aba/sessão para garantir 1 usuário = 1 linha
    function obterUidUnicoDaAba() {
      let uid = sessionStorage.getItem("UID_JURI_ACESSO");
      if (!uid) {
        uid = "U_" + Date.now() + "_" + Math.random().toString(36).substring(2, 8);
        sessionStorage.setItem("UID_JURI_ACESSO", uid);
      }
      return uid;
    }

    window.receberGrupoDaPlanilha = function(data) {
      if (redirecionou) return;
      redirecionou = true;

      if (data && data.allocated_group && LINKS[data.allocated_group]) {
        window.location.replace(LINKS[data.allocated_group]);
      } else if (data && data.redirect_url) {
        window.location.replace(data.redirect_url);
      }
    };

    function iniciarAcessoUnico() {
      // Impede que o pré-carregamento invisível do navegador crie linhas fantasmas
      if (document.visibilityState === "hidden" || document.visibilityState === "prerender") {
        document.addEventListener("visibilitychange", function aoFicarVisivel() {
          if (document.visibilityState === "visible") {
            document.removeEventListener("visibilitychange", aoFicarVisivel);
            dispararScriptUnico();
          }
        });
        return;
      }
      dispararScriptUnico();
    }

    function dispararScriptUnico() {
      if (jaDisparou) return;
      jaDisparou = true;

      const uid = obterUidUnicoDaAba();
      const script = document.createElement("script");
      script.src = `${APPS_SCRIPT_URL}?action=entrar&uid=${encodeURIComponent(uid)}&callback=receberGrupoDaPlanilha`;
      document.body.appendChild(script);
    }

    window.addEventListener("DOMContentLoaded", iniciarAcessoUnico);
  </script>

</body>
</html>
